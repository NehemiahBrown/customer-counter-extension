<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Price Is Right Counter</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main>
    <header>
      <h1>Add Players</h1>
      <hr />
    </header>

    <section id="players"></section>

    <section class="actions">
      <button class="add-player-btn" id="add-player" type="button">ADD PLAYER</button>

      <button class="danger-btn" id="reset-game" type="button">RESET GAME</button>
    </section>

    <p class="hint" id="status"></p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
